# Samsung Tizen endpoints
#
# Samsung's never-block list is the longest of any vendor and the entries are load-bearing.
# Blocking time.samsungcloudsolution.com alone breaks Plex, YouTube and Prime Video.

vendor: samsung
platform: tizen
updated: 2026-09-08

entries:
  # ---------------------------------------------------------------- content recognition
  # In-house rather than a third party. Frames sampled every 500 ms, sent about every
  # minute, peaking every five minutes.
  - domain: samsungacr.com
    wildcard: true
    purpose: acr
    tier: core
    safe_to_block: true
    breaks: null
    source: https://arxiv.org/html/2409.06203v1
    notes: >-
      Covers log-config, log-ingestion (US), log-ingestion-eu (EU and UK), log-1, log-2,
      log-3 and targeted-config-test.
  - domain: samsungcloud.tv
    wildcard: false
    regex: '^acr-[a-z]{2}-prd\.samsungcloud\.tv$'
    purpose: acr
    tier: core
    safe_to_block: true
    breaks: null
    source: https://arxiv.org/html/2409.06203v1
    notes: >-
      Regional endpoints acr-us-prd, acr-eu-prd, acr-au-prd, acr-br-prd, acr-ca-prd,
      acr-in-prd, acr-kr-prd, acr-mx-prd, acr-nz-prd. Scoped by regex so the rest of
      samsungcloud.tv is untouched.
  - domain: acr0.samsungcloudsolution.com
    purpose: acr
    tier: core
    safe_to_block: true
    breaks: null
    source: https://arxiv.org/html/2409.06203v1
    notes: >-
      Note the numbered prefix. Sibling hosts are plausible, which is why the collector
      normalises numeric shard suffixes to {n} rather than treating them as identifiers.

