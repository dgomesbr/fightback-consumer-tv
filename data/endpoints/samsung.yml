    breaks: Firmware updates fail. Reported on UE49KS7000 and QE55Q9FNA.
    source: https://github.com/Perflyst/PiHoleBlocklist/blob/master/SmartTV.txt
  - domain: otn.samsungcloudcdn.com
    purpose: ota
    tier: never
    safe_to_block: false
    breaks: Firmware updates fail.
    source: https://github.com/Perflyst/PiHoleBlocklist/blob/master/SmartTV.txt
  - domain: samsungcloudsolution.net
    wildcard: false
    regex: '^otnprd([89]|1[01])\.samsungcloudsolution\.net$'
    purpose: ota
    tier: never
    safe_to_block: false
    breaks: Firmware updates fail.
    source: https://github.com/Perflyst/PiHoleBlocklist/blob/master/SmartTV.txt
    notes: otnprd8 through otnprd11.
  - domain: osb-ussvc.samsungqbe.com
    purpose: functional
    tier: never
    safe_to_block: false
    breaks: Samsung TV Plus stops working.
    source: https://github.com/Perflyst/PiHoleBlocklist/blob/master/SmartTV.txt
  - domain: gpm.samsungqbe.com
    purpose: functional
    tier: never
    safe_to_block: false
    breaks: unknown
    source: https://github.com/Perflyst/PiHoleBlocklist/blob/master/SmartTV.txt
  - domain: ns11.whois.co.kr
    purpose: functional
    tier: never
    safe_to_block: false
    breaks: Series 7 sets cannot open YouTube.
    source: https://github.com/Perflyst/PiHoleBlocklist/blob/master/SmartTV.txt
    notes: >-
      A third-party Korean nameserver being load-bearing for YouTube on a Samsung TV is
      not something anyone would guess. This is why the never-block list exists.
  - domain: multiscreen.samsung.com
    purpose: functional
    tier: never
