  # ---------------------------------------------------------------- never block
  - domain: time.samsungcloudsolution.com
    purpose: ntp
    tier: never
    safe_to_block: false
    breaks: >-
      Plex, YouTube and Prime Video stop working on some sets. The TV loses time
      synchronisation, and apps that validate certificates fail as a result.
    source: https://github.com/Perflyst/PiHoleBlocklist/blob/master/SmartTV.txt
  - domain: auth.samsungosp.com
    purpose: functional
    tier: never
    safe_to_block: false
    breaks: Samsung account authentication fails.
    source: https://github.com/Perflyst/PiHoleBlocklist/blob/master/SmartTV.txt
  - domain: infolink.pavv.co.kr
    purpose: functional
    tier: never
    safe_to_block: false
    breaks: The app store and login stop working.
    source: https://github.com/Perflyst/PiHoleBlocklist/blob/master/SmartTV.txt
  - domain: lcprd1.samsungcloudsolution.net
