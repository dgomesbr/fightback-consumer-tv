  # ---------------------------------------------------------------- never block
  - domain: mesu.apple.com
    purpose: ota
    tier: never
    safe_to_block: false
    breaks: Software updates fail.
    source: https://support.apple.com/en-us/101555
  - domain: gdmf.apple.com
    purpose: ota
    tier: never
    safe_to_block: false
    breaks: Software updates fail.
    source: https://support.apple.com/en-us/101555
  - domain: gs.apple.com
    purpose: ota
    tier: never
    safe_to_block: false
    breaks: Software updates and activation fail.
    source: https://support.apple.com/en-us/101555
  - domain: albert.apple.com
    purpose: functional
    tier: never
    safe_to_block: false
    breaks: Device activation fails, which can leave a factory-reset Apple TV unusable.
    source: https://support.apple.com/en-us/101555
  - domain: itunes.apple.com
    wildcard: true
    purpose: functional
    tier: never
    safe_to_block: false
    breaks: The App Store and media playback stop working.
    source: https://support.apple.com/en-us/101555
  - domain: apps.apple.com
    wildcard: true
    purpose: functional
    tier: never
    safe_to_block: false
    breaks: The App Store stops working.
    source: https://support.apple.com/en-us/101555
  - domain: mzstatic.com
    wildcard: true
    purpose: cdn
    tier: never
    safe_to_block: false
    breaks: App Store artwork stops loading.
    source: https://support.apple.com/en-us/101555
  - domain: ocsp.apple.com
    purpose: functional
    tier: never
    safe_to_block: false
    breaks: Certificate validation fails, which can break app launches.
    source: https://support.apple.com/en-us/101555
  - domain: valid.apple.com
    purpose: functional
    tier: never
    safe_to_block: false
    breaks: Certificate validation fails.
    source: https://support.apple.com/en-us/101555
  - domain: push.apple.com
    wildcard: true
    purpose: functional
    tier: never
    safe_to_block: false
    breaks: Push notifications and several system services stop working.
    source: https://support.apple.com/en-us/101555
  - domain: guzzoni.apple.com
    purpose: functional
    tier: never
    safe_to_block: false
    breaks: Siri stops working. Block it deliberately if you do not want Siri.
    source: https://support.apple.com/en-us/101555
