# Apple tvOS endpoints
#
# tvOS runs no content recognition. The exposure is analytics and Apple's own ad network,
# which is a materially smaller surface than any other platform in this project. The
# never-block list matters more here than the blocklist, because Apple's update, activation
# and store hosts are easy to break by pattern-matching on names.

vendor: apple
platform: tvos
updated: 2026-09-08

entries:
  - domain: metrics.apple.com
    purpose: telemetry
    tier: core
    safe_to_block: true
    breaks: null
    source: https://raw.githubusercontent.com/nextdns/native-tracking-domains/main/domains/apple
