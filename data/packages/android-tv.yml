# Android TV and Google TV preinstalled packages
#
# Package safety is per model, not per platform. The community lists contradict each other,
# and both sides are probably right for their own hardware. This file therefore records
# which models an entry was tested on, and the generator refuses to emit a command for a
# model that is not listed.
#
# safe values:
#   true     documented as removable on the models in tested_on
#   false    documented to break something. Never emit.
#   unknown  nobody has checked. Never emit.
#
# Always pm disable-user rather than pm uninstall where the platform allows it, so the
# change is reversible without a factory reset.

platform: android-tv
also_applies_to: [google-tv]
updated: 2026-09-08

packages:
  # ================================================================ content recognition
  - package: tv.samba.ssm
    label: Samba TV
    purpose: acr
    vendors: [sony, tcl]
    tested_on: ["Sony Bravia, Android TV, model not recorded by source"]
    safe: true
    breaks: null
    source: https://github.com/ironshadow786786-boop/sony-google-tv-debloat
    notes: >-
      The single highest-value removal on a Sony set. The source labels it ad tracking and
      viewing data collection. Present in TCL Google TV lists as well. The matching Tier 0
      setting is Samba Interactive TV.

