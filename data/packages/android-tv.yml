  # ================================================================ contested
  - package: com.google.android.tvrecommendations
    label: Android TV recommendations
    purpose: telemetry
    vendors: [google, sony, tcl]
    tested_on: []
    safe: unknown
    breaks: >-
      Contested. One TCL toolkit lists this as a primary safe removal and reports a faster
      interface afterwards. A Sony guide lists it under packages that cause a boot loop if
      removed. Both may be correct for their own hardware.
    source: https://github.com/livvaa/TCL-Google-TV-Debloat-Optimizer
    source_contradicting: https://github.com/ironshadow786786-boop/sony-google-tv-debloat
    notes: >-
      This entry is why the whole file is scoped per model. Never emitted until somebody
      reports a specific model and firmware it was tested on. If you have tested it, that
      is a valuable pull request.

  # ================================================================ launcher, conditional
  - package: com.google.android.apps.tv.launcherx
    label: Google TV launcher
    purpose: ads
    vendors: [google, sony, tcl, hisense]
    tested_on: ["Chromecast with Google TV, per source"]
    safe: conditional
    requires: "A replacement launcher installed first, for example FLauncher or LtvLauncher"
    breaks: >-
      Without a replacement launcher the TV has no home screen. On Chromecast with Google
      TV the YouTube button on the remote stops working.
    source: https://github.com/osrosal/flauncher
    notes: The sponsored and recommended rows live here, which is why people remove it.
  - package: com.google.android.tungsten.setupwraith
    label: Android TV setup wizard and fallback launcher
    purpose: functional
    vendors: [google, sony, tcl, hisense]
    tested_on: ["Chromecast with Google TV, per source"]
    safe: conditional
    requires: "Only disable after disabling com.google.android.apps.tv.launcherx"
    breaks: >-
      Disabling this on its own achieves nothing and can interfere with setup. It is not a
      telemetry package, contrary to how it is often described. Its relevance is that it
      re-enables the default launcher, so a third-party launcher will not stick until it is
      disabled too.
    source: https://github.com/osrosal/flauncher

  # ================================================================ never remove
  - package: com.android.vpndialogs
    label: System VPN consent dialog
    purpose: functional
    vendors: [all]
    tested_on: []
    safe: false
    breaks: >-
      Any network monitoring or filtering app becomes permanently unusable. This package
      shows the system dialog that grants VpnService permission, so without it permission
      can never be granted again.
    source: https://github.com/ironshadow786786-boop/sony-google-tv-debloat
    notes: >-
      A widely shared Sony debloat one-liner uninstalls this. Anyone who runs that script
      and later tries to install a traffic observer will find it cannot work, with no
      obvious explanation. Recovery is a factory reset.
  - package: com.android.captiveportallogin
    label: Captive portal login
    purpose: functional
    vendors: [all]
    tested_on: []
    safe: false
    breaks: The TV cannot join networks that use a captive portal.
    source: https://github.com/ironshadow786786-boop/sony-google-tv-debloat
    notes: Removed by the same widely shared one-liner.
  - package: com.google.android.webview
