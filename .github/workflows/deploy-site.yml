name: Deploy site

# Builds the Astro site and publishes it to GitHub Pages.
#
# The guides are not copied into the site. Astro's content loader reads them from guides/ at
# the repository root, so the file a contributor edits in a pull request is the file a reader
# sees. There is no second copy to drift.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "guides/**"
      - "data/**"
      - "blocklists/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so Pages is never left mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Astro 7 requires Node 22.12 or later. Kept in step with the engines field in
      # site/package.json, so a local build and a CI build fail the same way.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Every guide reached the site
        run: |
          # A guide that exists in the repository but produced no page means the content
          # loader skipped it, usually because of malformed frontmatter. That would fail
          # silently otherwise: the build succeeds and the page is just missing.
          guides=$(find guides -name '*.md' -not -name '_*' | wc -l)
          pages=$(find site/dist/guides -name 'index.html' | wc -l)
          echo "guides in repo: $guides"
          echo "pages built:    $pages"
          if [ "$pages" -lt "$guides" ]; then
            echo "::error::$((guides - pages)) guide(s) did not produce a page"
            echo "Guides present:"; find guides -name '*.md' -not -name '_*' | sort
            echo "Pages built:"; find site/dist/guides -name 'index.html' | sort
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
